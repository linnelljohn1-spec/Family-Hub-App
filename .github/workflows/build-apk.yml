name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          dependency-graph: disabled
          add-job-summary: 'never' 

       Tar-d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "debug.keystore.base64 not found. Gradle will generate a default debug keystore if needed."
          fi

      # Forces the modern Gradle version required by AGP 9.1.1
      - name: Fix Broken Wrapper Jar
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          rm -f gradlew.bat
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || echo "Proceeding with system gradle fallback"

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk