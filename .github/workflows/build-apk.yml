name: Build Android Release APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Standard Gradle Setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          dependency-graph: disabled
          add-job-summary: 'never'

      # Sets up local variables and forcefully patches the KSP multi-threading bug
      - name: Create local environment and properties
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          # Ultimate patch for KSP compiler crashes
          touch gradle.properties
          echo "ksp.useDaemon=false" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties

      # Restores the persistent release keystore from a repo secret so every
      # build is signed with the same certificate (required for in-place APK updates)
      - name: Restore Release Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      # Wipes the broken wrapper file and generates the modern v9.3.1 required by your project
      - name: Fix Broken Wrapper Jar
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          rm -f gradlew.bat
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || echo "Proceeding with system gradle fallback"

      # Ensures permissions are set correctly
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew
            chmod +x gradlew
          fi

      # Compiles the Release version while injecting the automated version code
      - name: Build Release APK
        run: |
          SIGNING_FLAGS="-Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }}"
          VERSION_FLAGS="-Pandroid.injected.version.code=${{ github.run_number }} -Pandroid.injected.version.name=1.0.${{ github.run_number }}"
          
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease $SIGNING_FLAGS $VERSION_FLAGS
          else
            gradle assembleRelease $SIGNING_FLAGS $VERSION_FLAGS
          fi

      # --- NEW STEP: ALIGNS AND FORCES STABLE SIGNING SCHEMES ---
      - name: Align and Verify APK Package
        run: |
          mkdir -p apk-output
          # Find the actual compiled release APK
          RAW_APK=$(find . -path "*/build/outputs/apk/release/*.apk" ! -name "*-unsigned.apk" | head -n 1)
          
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          fi
          
          echo "Found compiled APK at: $RAW_APK"
          
          # Use the Android Build Tools inside the runner environment to verify or realign if needed
          BUILD_TOOLS_DIR=$(dirname $(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1))
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # Copy to output and apply an explicit apksigner enforcement pass
          cp "$RAW_APK" apk-output/family-hub-release.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks my-upload-key.jks --ks-pass pass:${{ secrets.RELEASE_KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.RELEASE_KEY_PASSWORD }} --ks-key-alias ${{ secrets.RELEASE_KEY_ALIAS }} apk-output/family-hub-release.apk || echo "Already signed natively"

      # Saves and exposes the clean, single APK directly at the zip root
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apk-output/