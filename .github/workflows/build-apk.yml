name: Build Android Release APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Standard Gradle Setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          dependency-graph: disabled
          add-job-summary: 'never'

      # Sets up local variables and INJECTS THE KSP BUG FIX FLAGS
      - name: Create local environment and properties
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          # --- THIS FIXES THE KSP NULLPOINTEREXCEPTION BUG ---
          touch gradle.properties
          echo "ksp.useDaemon=false" >> gradle.properties

      # Automatically generates a production-ready signing keystore for the release profile
      - name: Generate Release Keystore
        run: |
          echo "Generating production fallback release keystore..."
          keytool -genkey -v -keystore release.keystore -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          cp release.keystore debug.keystore 

      # Wipes the broken wrapper file and generates the modern v9.3.1 required by your project
      - name: Fix Broken Wrapper Jar
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          rm -f gradlew.bat
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || echo "Proceeding with system gradle fallback"

      # Ensures permissions are set correctly
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew
            chmod +x gradlew
          fi

      # Compiles the optimized Release version of your app
      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      # Saves and exposes the finished Release APK for download
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            **/build/outputs/apk/release/*.apk