name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Standard Gradle Setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          dependency-graph: disabled
          add-job-summary: 'never'

      # Sets up local variables if your project needs them
      - name: Create local .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      # Decodes your keystore OR automatically generates a valid fallback debug one
      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding provided debug.keystore..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "debug.keystore.base64 not found. Automatically generating standard fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Wipes the broken wrapper file and generates the modern v9.3.1 required by your project
      - name: Fix Broken Wrapper Jar
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          rm -f gradlew.bat
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || echo "Proceeding with system gradle fallback"

      # Ensures permissions are set correctly
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew
            chmod +x gradlew
          fi

      # Compiles the debug build
      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      # Saves and exposes the finished APK for download
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk