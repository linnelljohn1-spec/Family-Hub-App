name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Create local .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "debug.keystore.base64 not found. Gradle will generate a default debug keystore if needed."
          fi

      # --- THIS IS THE NEW STEP THAT FIXES THE CORRUPT JAR ---
      - name: Regenerate Gradle Wrapper
        run: jar cfe gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -C . . 2>/dev/null || gradle wrapper --gradle-version 8.5

      - name: Make Gradle Wrapper Executable
        run: |
          tr -d '\r' < gradlew > gradlew.tmp
          mv gradlew.tmp gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk