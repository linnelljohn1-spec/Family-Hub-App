name: Build Android Release APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Standard Gradle Setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          dependency-graph: disabled
          add-job-summary: 'never'

      # Sets up local variables and forcefully patches the KSP multi-threading bug
      - name: Create local environment and properties
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          # Ultimate patch for KSP compiler crashes
          touch gradle.properties
          echo "ksp.useDaemon=false" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties

      # Generates the production-ready signing keystore
      - name: Generate Release Keystore
        run: |
          echo "Generating production matching my-upload-key.jks..."
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          cp my-upload-key.jks debug.keystore 
          cp my-upload-key.jks release.keystore

      # Wipes the broken wrapper file and generates the modern v9.3.1 required by your project
      - name: Fix Broken Wrapper Jar
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          rm -f gradlew.bat
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || echo "Proceeding with system gradle fallback"

      # Ensures permissions are set correctly
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew
            chmod +x gradlew
          fi

      # Compiles the Release version while injecting the AUTOMATED VERSION CODE
      - name: Build Release APK
        run: |
          # 1. Base configuration flags for your signing keys
          SIGNING_FLAGS="-Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androidreleasekey -Pandroid.injected.signing.key.password=android"
          
          # 2. Dynamic Version Code Injection (using GitHub Run Number)
          VERSION_FLAGS="-Pandroid.injected.version.code=${{ github.run_number }} -Pandroid.injected.version.name=1.0.${{ github.run_number }}"
          
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease $SIGNING_FLAGS $VERSION_FLAGS
          else
            gradle assembleRelease $SIGNING_FLAGS $VERSION_FLAGS
          fi

      # Flatten the output folder structure for clean delivery
      - name: Prepare APK for Flat Upload
        run: |
          mkdir -p apk-output
          find . -name "*.apk" -exec cp {} apk-output/ \;

      # Saves and exposes the finished Release APK directly at the zip root
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apk-output/